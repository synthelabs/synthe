name: Synthe
description: Improves an agent's system prompt against simulated scenarios and merges what wins.
branding: { icon: trending-up, color: blue }
inputs:
  step: { description: "write, score or decide", required: true }
  github-token: { description: Token for this job, required: true }
  anthropic-api-key: { description: "Model key, used by write and score only", required: false, default: "" }
  event-code: { description: "Event credit code, used only without your own model key", required: false, default: "" }
  team-code: { description: "Team code from the event organizers, sent with the event code", required: false, default: "" }
outputs:
  go: { description: "true when a round should run" }
runs:
  using: node24
  main: dist/action.mjs
