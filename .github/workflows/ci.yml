# Tests on every push and pull request, with the Lean spec built first so the merge rule is always checked against
# its proved model (test/lean-spec.test.ts fails instead of skipping when CI=true and the binary is missing).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Lean (elan, toolchain from spec/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            spec/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('spec/lean-toolchain', 'spec/lake-manifest.json') }}-${{ hashFiles('spec/**/*.lean') }}
          restore-keys: lean-${{ runner.os }}-${{ hashFiles('spec/lean-toolchain', 'spec/lake-manifest.json') }}-
      - name: Build and check the Lean spec (proofs included)
        working-directory: spec
        run: lake build
      - run: npm run typecheck
      - run: npm test
      - name: Stress the differential test across seeds
        run: for s in 1 2 3; do LEAN_SPEC_CASES=20000 LEAN_SPEC_SEED=$s node --test test/lean-spec.test.ts; done
