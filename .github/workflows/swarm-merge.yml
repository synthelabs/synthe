# The swarm's merge job. An agent opens a pull request into `integration`. This job refuses it if it touches a frozen
# path, checks the merged result, and merges it when the check passes. It refuses only a conflict, a frozen path or a
# failed check; review is not a gate here. A maintainer promotes `integration` to `main` in batches.
#
# The trigger is pull_request, not pull_request_target: GitHub runs a pull_request_target workflow only from the
# default branch, and this file lives on `integration`. So this file runs as it is in the pull request's merge commit,
# and a pull request could change its own gate. The guard refuses any change under .github/, and the monitor reads
# every merge, so such a change cannot land unseen. Move this to pull_request_target when it reaches `main`.
# The check job runs the pull request's code with a read-only token, no secrets and no cache writes.
name: Swarm merge
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [integration]
permissions: {}
concurrency:
  group: swarm-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  guard:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Refuse frozen paths and dist/
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          bad=$(printf '%s\n' "$files" | grep -E '^(swarm/|test/milestones/|\.github/|\.claude/|scripts/swarm/|dist/|AGENTS\.md$|CLAUDE\.md$)' | sort -u || true)
          if [ -n "$bad" ]; then
            {
              echo "The swarm merge job refused this pull request. It changes paths that the swarm must not change:"
              echo
              printf -- '- `%s`\n' $bad
              echo
              echo 'Remove these changes. Do not commit `dist/`: this job rebuilds it after the merge. If a frozen check is wrong, post a `check-bug` note in the ledger.'
              echo
              echo '---'
              echo '_Generated by [Claude Code](https://claude.ai/code)_'
            } > body.md
            gh pr comment "$PR" --repo "$REPO" --body-file body.md
            exit 1
          fi

  check:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The Lean spec runs in the main CI workflow. CI is unset here so test/lean-spec.test.ts skips without the binary.
      - run: npm test
        env:
          CI: ""
      - run: npm run bench -- --check
      - name: Milestones (shown in the summary; not a gate)
        if: always()
        run: |
          { echo '## Milestones on the merged result'; echo '```'; npm run -s milestones || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  merge:
    needs: [guard, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the pull request (refused if the head moved)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$SHA"
      - uses: actions/checkout@v4
        with:
          ref: integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Rebuild dist/ on integration
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "synthe-swarm"
          git config user.email "swarm@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin integration && git reset -q --hard origin/integration
            npm run build
            git add dist
            if git diff --cached --quiet; then echo "dist/ is current."; exit 0; fi
            git commit -qm "Rebuild dist/ after #$PR"
            if git push -q origin HEAD:integration; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "Could not push the rebuilt dist/ after 5 attempts." >&2
          exit 1
