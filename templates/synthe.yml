# Added by `npx synthe init`. Stop any time with `npx synthe stop`.
name: Synthe
on:
  workflow_dispatch:
  schedule:
    # A wake-up every 10 minutes, at a random offset init picks so teams don't all call at once. GitHub drops
    # scheduled runs when it's busy (once, one hourly trigger in 16 hours), so frequent wake-ups make sure a round
    # still happens about every hour; a wake-up that comes too soon after the last round exits in seconds.
    - cron: "__MINUTE__-59/10 * * * *"
concurrency:
  group: synthe
  cancel-in-progress: false
permissions: {}
jobs:
  write:
    runs-on: ubuntu-latest
    # Two writer calls take a minute or two; the cap stops a hung call holding the "synthe" group for hours.
    timeout-minutes: 15
    # pull-requests: read lets it see that a team merged or closed Synthe's proposal, so no hour is lost waiting.
    permissions: { contents: read, pull-requests: read }
    outputs:
      go: ${{ steps.write.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - id: write
        uses: __ACTION__
        with:
          step: write
          github-token: ${{ github.token }}
          anthropic-api-key: ${{ secrets.SYNTHE_ANTHROPIC_KEY }}
      - uses: actions/upload-artifact@v4
        if: steps.write.outputs.go == 'true'
        with: { name: candidates, path: .synthe-out/candidates.json, include-hidden-files: true }
      # Why this step failed, so the report can tell a busy API (try again next hour) from a key to replace.
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: write-error, path: .synthe-out/error.json, include-hidden-files: true, if-no-files-found: ignore }
  score:
    needs: write
    if: needs.write.outputs.go == 'true'
    runs-on: ubuntu-latest
    # About 150 model calls, 6 at a time: a minute or two in live runs. The cap leaves room for the client's retries.
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: candidates, path: .synthe-out }
      - uses: __ACTION__
        with:
          step: score
          github-token: ${{ github.token }}
          anthropic-api-key: ${{ secrets.SYNTHE_ANTHROPIC_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: scores, path: .synthe-out/scores.json, include-hidden-files: true }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: score-error, path: .synthe-out/error.json, include-hidden-files: true, if-no-files-found: ignore }
  decide:
    needs: [write, score]
    # Runs after a failed write or score, so the round is recorded and the report says why. Not after a run someone
    # cancelled: that isn't a round that found nothing, and it says nothing about the key.
    if: ${{ !cancelled() && needs.write.result != 'skipped' && needs.write.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    # Only GitHub calls, each retried for at most a minute when rate-limited.
    timeout-minutes: 10
    # The only job that can write. It holds no model key and never checks out or runs repo code.
    permissions: { contents: write, pull-requests: write, issues: write }
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { path: .synthe-out, merge-multiple: true }
      - uses: __ACTION__
        with:
          step: decide
          github-token: ${{ github.token }}
