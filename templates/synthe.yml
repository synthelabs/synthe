# Added by `npx synthe init`. Stop any time with `npx synthe stop`.
name: Synthe
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
concurrency:
  group: synthe
  cancel-in-progress: false
permissions: {}
jobs:
  write:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      go: ${{ steps.write.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - id: write
        uses: __ACTION__
        with:
          step: write
          github-token: ${{ github.token }}
          anthropic-api-key: ${{ secrets.SYNTHE_ANTHROPIC_KEY }}
      - uses: actions/upload-artifact@v4
        if: steps.write.outputs.go == 'true'
        with: { name: candidates, path: .synthe-out/candidates.json, include-hidden-files: true }
  score:
    needs: write
    if: needs.write.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: candidates, path: .synthe-out }
      - uses: __ACTION__
        with:
          step: score
          github-token: ${{ github.token }}
          anthropic-api-key: ${{ secrets.SYNTHE_ANTHROPIC_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: scores, path: .synthe-out/scores.json, include-hidden-files: true }
  decide:
    needs: [write, score]
    if: always() && needs.write.result != 'skipped' && needs.write.outputs.go != 'false'
    runs-on: ubuntu-latest
    # The only job that can write. It holds no model key and never checks out or runs repo code.
    permissions: { contents: write, pull-requests: write, issues: write }
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { path: .synthe-out, merge-multiple: true }
      - uses: __ACTION__
        with:
          step: decide
          github-token: ${{ github.token }}
